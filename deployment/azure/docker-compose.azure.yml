# Azure Deployment — CVAT with Audio Playback Feature
# =====================================================
# Architecture: Azure VM (Standard B2s) + Docker Compose
# Why: Single VM + Docker Compose is the simplest, cheapest, most reproducible
#      approach for a student demo. No Kubernetes, no managed databases, no PaaS complexity.
#      All Part A modifications (audio extraction, TUS fixes, scrub sync) are preserved as-is.
#
# In production Docker Compose mode, Traefik serves BOTH the UI and backend on the
# same port (80), so the 3000/8081 dev split does not exist — TUS proxy and CORS
# overrides are NOT needed on the VM. Audio endpoint works on the same origin.

name: cvat

x-backend-env: &backend-env
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_LOG_IMPORT_ERRORS: 'true'
  CVAT_ALLOW_STATIC_CACHE: 'yes'
  DJANGO_LOG_SERVER_HOST: vector
  DJANGO_LOG_SERVER_PORT: 8282
  no_proxy: clickhouse,grafana,vector,nuclio,opa,${no_proxy:-}
  SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:-}
  # Allow the VM public IP + any domain
  ALLOWED_HOSTS: "${CVAT_HOST},localhost,127.0.0.1"
  DJANGO_MODWSGI_EXTRA_ARGS: ""

services:
  # ─── Override: expose Traefik on port 80 (standard HTTP) ───────────────────
  traefik:
    ports:
      - "80:8080"
      - "8090:8090"
    environment:
      CVAT_HOST: ${CVAT_HOST}
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: :8080
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: cvat
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/rules
      TRAEFIK_LOG_FORMAT: json
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_ACCESSLOG_FIELDS_DEFAULTMODE: drop
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_ClientHost: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_DownstreamStatus: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestMethod: keep
      TRAEFIK_ACCESSLOG_FIELDS_NAMES_RequestPath: keep

  # ─── Override: backend with Azure-appropriate settings ─────────────────────
  cvat_server:
    environment:
      <<: *backend-env
      CVAT_HOST: ${CVAT_HOST}
      # CSRF trusted origins — include the public IP and any domain you set
      CSRF_TRUSTED_ORIGINS: "http://${CVAT_HOST},https://${CVAT_HOST}"
      # Disable debug in production
      DJANGO_DEBUG: "False"
      # Secret key — override in .env file with a real value
      SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}

  cvat_worker_import:
    environment:
      <<: *backend-env
      CVAT_HOST: ${CVAT_HOST}

  cvat_worker_export:
    environment:
      <<: *backend-env
      CVAT_HOST: ${CVAT_HOST}

  cvat_worker_annotation:
    environment:
      <<: *backend-env
      CVAT_HOST: ${CVAT_HOST}
